enum SWResetMode {
    SW_RESET_SAFETY = 0;
    SW_RESET_FORCE = 1;
    SW_RESET_ON_BOOT = 2;
}

enum FrameBufferFormat {
    FORMAT_420 = 0;
    FORMAT_422 = 1;
    FORMAT_224 = 2;
    FORMAT_444 = 3;
    FORMAT_400 = 4;

    FORMAT_420_P10_16BIT_MSB = 5;
    FORMAT_420_P10_16BIT_LSB = 6;
    FORMAT_420_P10_32BIT_MSB = 7;
    FORMAT_420_P10_32BIT_LSB = 8;
    FORMAT_422_P10_16BIT_MSB = 9;
    FORMAT_422_P10_16BIT_LSB = 10;
    FORMAT_422_P10_32BIT_MSB = 11;
    FORMAT_422_P10_32BIT_LSB = 12;

    FORMAT_YUYV = 13;
    FORMAT_YUYV_P10_16BIT_MSB = 14;
    FORMAT_YUYV_P10_16BIT_LSB = 15;
    FORMAT_YUYV_P10_32BIT_MSB = 16;
    FORMAT_YUYV_P10_32BIT_LSB = 17;

    FORMAT_YVYU = 18;
    FORMAT_YVYU_P10_16BIT_MSB = 19;
    FORMAT_YVYU_P10_16BIT_LSB = 20;
    FORMAT_YVYU_P10_32BIT_MSB = 21;
    FORMAT_YVYU_P10_32BIT_LSB = 22;

    FORMAT_UYVY = 23;
    FORMAT_UYVY_P10_16BIT_MSB = 24;
    FORMAT_UYVY_P10_16BIT_LSB = 25;
    FORMAT_UYVY_P10_32BIT_MSB = 26;
    FORMAT_UYVY_P10_32BIT_LSB = 27;

    FORMAT_VYUY = 28;
    FORMAT_VYUY_P10_16BIT_MSB = 29;
    FORMAT_VYUY_P10_16BIT_LSB = 30;
    FORMAT_VYUY_P10_32BIT_MSB = 31;
    FORMAT_VYUY_P10_32BIT_LSB = 32;

    FORMAT_MAX = 33;
}

enum SramMode {
    MODE_SRAM_AXI_EXCLUSIVE = 0;
    MODE_SRAM_AXI_LINEBUFFER_SHARE = 1;
    MODE_SRAM_LINEBUFFER = 2;
    MODE_SRAM_MAX = 3;
}

enum StreamUpFlag {
    STREAM_FILL = 0;
    STREAM_UPDATE = 1;
    STREAM_END = 2;
    STREAM_END_CLEAR = 3;
}

enum ErrorConcealUnit {
    ERROR_CONCEAL_UNIT_PICTURE = 0;
    ERROR_CONCEAL_UNIT_SLICE_TILE = 1;
    ERROR_CONCEAL_UNIT_BLOCK_ROW = 2;
    ERROR_CONCEAL_UNIT_BLOCK = 3;
}

enum ErrorConcealMode {
    ERROR_CONCEAL_MODE_OFF = 0;
    ERROR_CONCEAL_MODE_INTRA_ONLY = 1;
    ERROR_CONCEAL_MODE_INTRA_INTER = 2;
}

message DecHandle {
    required uint32 handle = 1;
}

message DecOpenParam {
    optional CodStd bitstream_format = 1;
    optional uint32 bitstream_buffer = 2;
    optional int32 bitstream_buffer_size = 3;
    optional int32 mp4_deblk_enable = 4;
    optional int32 avc_extension = 5;
    optional int32 mp4_class = 6;
    optional int32 tiled2_linear_enable = 7;
    optional int32 tiled2_linear_mode = 8;
    optional int32 wtl_enable = 9;
    optional int32 wtl_mode = 10;
    optional int32 cbcr_interleave = 11;
    optional int32 nv21 = 12;
    optional int32 cbcr_order = 13;
    optional int32 bwb_enable = 14;
    optional EndianMode frame_endian = 15;
    optional EndianMode stream_endian = 16;
    optional int32 bitstream_mode = 17;
    optional uint32 core_idx = 18;
    optional int32 fbc_mode = 19;
    optional uint32 virt_axi_i_d = 20;
    optional bool bw_optimization = 21;
    optional uint32 div3_width = 22;
    optional uint32 div3_height = 23;
    optional bool pvric_fbc_enable = 24;
    optional uint32 pvric31_hw_support = 25;
    optional bool enable_non_ref_fbc_write = 26;
    optional int32 enable_pvric_v31 = 27;
    optional bool temp_id_select_mode = 28;
    optional int32 av1_format = 29;
    optional ErrorConcealUnit error_conceal_unit = 30;
    optional ErrorConcealMode error_conceal_mode = 31;
    optional bool sram_enable = 32;
}

message DecOpen {
    required DecHandle handle = 1;
    optional DecOpenParam dec_op = 2;
    optional RetCode ret_code = 3;
}

message SecAxiUse {
    message Coda9 {
        optional int32 use_bit_enable = 1;
        optional int32 use_ip_enable = 2;
        optional int32 use_dbk_y_enable = 3;
        optional int32 use_dbk_c_enable = 4;
        optional int32 use_ovl_enable = 5;
        optional int32 use_btp_enable = 6;
        optional int32 use_me_enable = 7;
        optional int32 use_scaler_enable = 8;
    }
    message Wave4 {
        optional int32 use_scl_enable = 1;
        optional int32 use_scl_packed_mode_enable = 2;
        optional int32 use_bit_enable = 3;
        optional int32 use_ip_enable = 4;
        optional int32 use_lf_row_enable = 5;
        optional int32 use_enc_imd_enable = 6;
        optional int32 use_enc_lf_enable = 7;
        optional int32 use_enc_rdo_enable = 8;
    }
    message Wave5 {
        optional int32 use_scl_enable = 1;
        optional int32 use_bit_enable = 2;
        optional int32 use_ip_enable = 3;
        optional int32 use_lf_row_enable = 4;
        optional int32 use_enc_lf_enable = 5;
        optional int32 use_enc_rdo_enable = 6;
    }
    required DecHandle handle = 1;
    oneof U {
        Coda9 coda9 = 2;
        Wave4 wave4 = 3;
        Wave5 wave5 = 4;
    }
}

message DecGiveCommand {
    required DecHandle handle = 1;
    optional CodecCommand cmd = 2;
    optional RetCode ret_code = 3;
    oneof Param {
        SecAxiUse sec_axi_use = 4;
    }
}

message DecGetBitstreamBuffer {
    required DecHandle handle = 1;
    optional uint32 prd_ptr = 2;
    optional uint32 pwr_ptr = 3;
    optional uint32 size = 4;
    optional RetCode ret_code = 5;
}

message DecUpdateBitstreamBuffer {
    required DecHandle handle = 1;
    optional int32 size = 2;
    optional StreamUpFlag flag = 3;
    optional RetCode ret_code = 4;
}

message DecPicEndModeUpdateBSBuffer {
    required DecHandle handle = 1;
    optional uint32 addr = 2;
    optional uint32 size = 3;
    optional StreamUpFlag flag = 4;
    optional RetCode ret_code = 5;
}

message VpuRect {
    optional uint32 left = 1;
    optional uint32 top = 2;
    optional uint32 right = 3;
    optional uint32 bottom = 4;
}

message ThoScaleInfo {
    optional int32 frame_width = 1;
    optional int32 frame_height = 2;
    optional int32 pic_width = 3;
    optional int32 pic_height = 4;
    optional int32 pic_offset_x = 5;
    optional int32 pic_offset_y = 6;
}

message Vp8ScaleInfo {
    optional int32 h_scale_factor = 1;
    optional int32 v_scale_factor = 2;
    optional int32 pic_width = 3;
    optional int32 pic_height = 4;
}

message AvcVuiInfo {
    optional int32 fixed_frame_rate_flag = 1;
    optional int32 timing_info_present = 2;
    optional int32 chroma_loc_bot_field = 3;
    optional int32 chroma_loc_top_field = 4;
    optional int32 chroma_loc_info_present = 5;
    optional int32 color_primaries = 6;
    optional int32 color_desc_present = 7;
    optional int32 is_ext_s_a_r = 8;
    optional int32 vid_full_range = 9;
    optional int32 vid_format = 10;
    optional int32 vid_sig_type_present = 11;
    optional int32 vui_param_present = 12;
    optional int32 vui_pic_struct_present = 13;
    optional int32 vui_pic_struct = 14;
    optional int32 vui_transfer_characteristics = 15;
    optional int32 vui_matrix_coefficients = 16;
}

message MP2BarDataInfo {
    optional int32 bar_left = 1;
    optional int32 bar_right = 2;
    optional int32 bar_top = 3;
    optional int32 bar_bottom = 4;
}

message DecInitialInfo {
    optional int32 pic_width = 1;
    optional int32 pic_height = 2;
    optional int32 f_rate_numerator = 3;
    optional int32 f_rate_denominator = 4;
    optional VpuRect pic_crop_rect = 5;
    optional int32 mp4_data_partition_enable = 6;
    optional int32 mp4_reversible_vlc_enable = 7;
    optional int32 mp4_short_video_header = 8;
    optional int32 h263_annex_j_enable = 9;
    optional int32 min_frame_buffer_count = 10;
    optional int32 frame_buf_delay = 11;
    optional int32 normal_slice_size = 12;
    optional int32 worst_slice_size = 13;
    optional int32 max_sub_layers = 14;
    optional int32 profile = 15;
    optional int32 level = 16;
    optional int32 tier = 17;
    optional int32 interlace = 18;
    repeated int32 constraint_set_flag = 19 [packed = true];
    optional int32 direct8x8_flag = 20;
    optional int32 vc1_psf = 21;
    optional int32 is_ext_s_a_r = 22;
    optional int32 max_num_ref_frm_flag = 23;
    optional int32 max_num_ref_frm = 24;
    optional int32 aspect_rate_info = 25;
    optional int32 bit_rate = 26;
    optional int32 mp2_low_delay = 27;
    optional int32 mp2_disp_ver_size = 28;
    optional int32 mp2_disp_hor_size = 29;
    optional uint32 user_data_header = 30;
