syntax = "proto2";
package Vpu;

enum RetCode {
    RETCODE_SUCCESS = 0;
    RETCODE_FAILURE = 1;
    RETCODE_INVALID_HANDLE = 2;
    RETCODE_INVALID_PARAM = 3;
    RETCODE_INVALID_COMMAND = 4;
    RETCODE_ROTATOR_OUTPUT_NOT_SET = 5;
    RETCODE_ROTATOR_STRIDE_NOT_SET = 6;
    RETCODE_FRAME_NOT_COMPLETE = 7;
    RETCODE_INVALID_FRAME_BUFFER = 8;
    RETCODE_INSUFFICIENT_FRAME_BUFFERS = 9;
    RETCODE_INVALID_STRIDE = 10;
    RETCODE_WRONG_CALL_SEQUENCE = 11;
    RETCODE_CALLED_BEFORE = 12;
    RETCODE_NOT_INITIALIZED = 13;
    RETCODE_USERDATA_BUF_NOT_SET = 14;
    RETCODE_MEMORY_ACCESS_VIOLATION = 15;
    RETCODE_VPU_RESPONSE_TIMEOUT = 16;
    RETCODE_INSUFFICIENT_RESOURCE = 17;
    RETCODE_NOT_FOUND_BITCODE_PATH = 18;
    RETCODE_NOT_SUPPORTED_FEATURE = 19;
    RETCODE_NOT_FOUND_VPU_DEVICE = 20;
    RETCODE_CP0_EXCEPTION = 21;
    RETCODE_STREAM_BUF_FULL = 22;
    RETCODE_ACCESS_VIOLATION_HW = 23;
    RETCODE_QUERY_FAILURE = 24;
    RETCODE_QUEUEING_FAILURE = 25;
}

enum CodStd {
    STD_AVC = 0;
    STD_VC1 = 1;
    STD_MPEG2 = 2;
    STD_MPEG4 = 3;
    STD_H263 = 4;
    STD_DIV3 = 5;
    STD_RV = 6;
    STD_AVS = 7;
    STD_THO = 9;
    STD_VP3 = 10;
    STD_VP8 = 11;
    STD_HEVC = 12;
    STD_VP9 = 13;
    STD_AVS2 = 14;
    STD_SVAC = 15;
    STD_AV1 = 16;
    STD_MAX = 17;
}

enum EndianMode {
    VDI_LITTLE_ENDIAN = 0;      /*64bit LE*/
    VDI_BIG_ENDIAN = 1;             /*64bit BE*/
    VDI_32BIT_LITTLE_ENDIAN = 2;
    VDI_32BIT_BIG_ENDIAN = 3;
    /*WAVE410 ONLY*/
    VDI_128BIT_BIG_ENDIAN = 16;
    VDI_128BIT_BE_BYTE_SWAP = 17;
    VDI_128BIT_BE_WORD_SWAP = 18;
    VDI_128BIT_BE_WORD_BYTE_SWAP = 19;
    VDI_128BIT_BE_DWORD_SWAP = 20;
    VDI_128BIT_BE_DWORD_BYTE_SWAP = 21;
    VDI_128BIT_BE_DWORD_WORD_SWAP = 22;
    VDI_128BIT_BE_DWORD_WORD_BYTE_SWAP = 23;
    VDI_128BIT_LE_DWORD_WORD_BYTE_SWAP = 24;
    VDI_128BIT_LE_DWORD_WORD_SWAP = 25;
    VDI_128BIT_LE_DWORD_BYTE_SWAP = 26;
    VDI_128BIT_LE_DWORD_SWAP = 27;
    VDI_128BIT_LE_WORD_BYTE_SWAP = 28;
    VDI_128BIT_LE_WORD_SWAP = 29;
    VDI_128BIT_LE_BYTE_SWAP = 30;
    VDI_128BIT_LITTLE_ENDIAN = 31;
    VDI_ENDIAN_MAX = 32;
}

