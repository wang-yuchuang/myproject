# emmc_only 变体参数组 (ssdk-standalone-boot-mode Stage-3)
# 用途: 模板 defconfig + 本文件 -> 构建期 emmc_only 变体 defconfig (旧 ref 工程)
# 语义: OCRAM 链接 (MEM_BASE=0x140000, 不经 calc) / 关 xip 侧 bool / STR 保持 y
#
# 约束: Kconfiglib defconfig.py 不支持赋值行行尾注释 (含注释则整行被丢弃),
#       注释必须独立成行 (本文件已遵守)
# 注: RAM_BASE/RAM_SIZE/TCM/IRAM 由 secure/Kconfig 默认值覆盖(依赖 XIP_MODE,
#     随 XIP_MODE off 自动失效), 无需在此处理; 模板中 ref 侧 8 项 bool 保持 y
CONFIG_MEM_BASE=0x140000
CONFIG_MEM_SIZE=0xC0000
CONFIG_IPCC_BUFF_NUM=16

# --- xip 侧 bool 差异关闭 (模板置 y 项在此关闭) ---
# CONFIG_XIP_MODE is not set
# CONFIG_EARLYCOPY is not set
# CONFIG_UPDATE_MONITOR is not set
# CONFIG_UPDATE_FLASH is not set

# --- boot media: NOR_XIP 关闭, 改 EMMC; 关 xip 侧 GPT_SLOT_SWITCH (option B, 对齐 bmu05) ---
# CONFIG_SYSMON_BOOT_MEDIA_NOR_XIP is not set
CONFIG_SYSMON_BOOT_MEDIA_EMMC=y
# CONFIG_GPT_SLOT_SWITCH is not set
# FLASH_TEST: xip-side bool, keeps emu01 emmc unchanged (no flash_test / no DISK_NOR_FLASH select)
# CONFIG_FLASH_TEST is not set
