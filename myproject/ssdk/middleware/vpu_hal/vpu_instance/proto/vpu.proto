    DEC_SET_FBC_CUR_FRAME_IDX = 49;
    DEC_SET_INTER_RES_INFO_ON = 50;
    DEC_SET_INTER_RES_INFO_OFF = 51;
    DEC_FREE_FBC_TABLE_BUFFER = 52;
    DEC_FREE_MV_BUFFER = 53;
    DEC_ALLOC_FBC_Y_TABLE_BUFFER = 54;
    DEC_ALLOC_FBC_C_TABLE_BUFFER = 55;
    DEC_ALLOC_MV_BUFFER = 56;
    DEC_SET_TEMPORAL_ID_MODE = 57;
    ENC_ADD_PPS = 58;
