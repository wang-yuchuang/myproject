    optional int32 mp2_transfer_char = 39;
    optional int32 mp2_matrix_coeff = 40;
    optional int32 seq_init_err_reason = 41;
    optional int32 warn_info = 42;
    optional uint32 rd_ptr = 43;
    optional uint32 wr_ptr = 44;
    optional uint32 sequence_no = 45;
    optional int32 num_reorder_frames = 46;
    optional int32 spatial_svc_enable = 47;
    optional int32 spatial_svc_mode = 48;
    optional uint32 output_bit_depth = 49;
    optional uint32 vlc_buf_size = 50;
    optional uint32 param_buf_size = 51;
    oneof CodecModeInfo {
        ThoScaleInfo tho_scale_info = 52;
        Vp8ScaleInfo vp8_scale_info = 53;
        AvcVuiInfo avc_vui_info = 54;
        MP2BarDataInfo mp2_bardata_info = 55;
        DecHevcInfo hevc_info = 56;
    }
}

message DecSeqInit {
    required DecHandle handle = 1;
    optional DecInitialInfo initial_info = 2;
    optional sint32 interrupt_reaseon = 3;
    optional RetCode ret_code = 4;
}

message SWReset {
    required uint32 core_idx = 1;
    optional SWResetMode reset_mode = 2;
    optional uint32 handle = 3;
    optional RetCode ret_code = 4;
}

message FrameBufferAllocInfo {
    optional int32 map_type = 1;
    optional int32 cbcr_interleave = 2;
    optional int32 nv21 = 3;
    optional FrameBufferFormat format = 4;
    optional int32 stride = 5;
    optional int32 height = 6;
    optional int32 size = 7;
    optional int32 luma_bit_depth = 8;
    optional int32 chroma_bit_depth = 9;
    optional int32 endian = 10;
    optional int32 num = 11;
    optional int32 type = 12;
}

message FrameBuffer {
    optional uint32 buf_y = 1;
    optional uint32 buf_cb = 2;
    optional uint32 buf_cr = 3;
    optional uint32 buf_y_bot = 4;
    optional uint32 buf_cb_bot = 5;
    optional uint32 buf_cr_bot = 6;
    optional uint32 buf_y_size = 7;
    optional uint32 buf_cb_size = 8;
    optional uint32 buf_cr_size = 9;
    optional int32 cbcr_interleave = 10;
    optional int32 nv21 = 11;
    optional int32 endian = 12;
    optional int32 my_index = 13;
    optional int32 map_type = 14;
    optional int32 stride = 15;
    optional int32 width = 16;
    optional int32 height = 17;
    optional int32 size = 18;
    optional int32 size_luma = 19;
    optional int32 size_chroma = 20;
    optional int32 luma_bit_depth = 21;
    optional int32 chroma_bit_depth = 22;
    optional FrameBufferFormat format = 23;
    optional int32 source_l_burst_en = 24;
    optional int32 src_buf_state = 25;
    optional int32 alloc_num = 26;
    optional int32 src_end_flag = 27;
    optional int32 sequence_no = 28;
    optional int32 packed_enable = 29;
    optional int32 packed_mode = 30;
    optional bool update_fb_info = 31;
}

message DecRegisterDecodeBuffer{
    required DecHandle handle = 1;
    optional RetCode ret_code = 2;
    optional FrameBufferAllocInfo fb_alloc_info_dec = 3;
    optional FrameBufferAllocInfo fb_alloc_info_wtl = 4;
    optional int32 vb_frame_dec_size = 5;
    repeated uint32 vb_frame_dec_phys_addr = 6 [packed = true];
    optional int32 vb_frame_wtl_size = 7;
    repeated uint32 vb_frame_wtl_phys_addr = 8 [packed = true];
    optional bool vp9_res_change = 9;
    optional bool enable_scaler = 10;
    optional uint32 scale_width = 11;
    optional uint32 scale_height = 12;
}

message DecSetRdPtr {
    required DecHandle handle = 1;
    optional uint32 addr = 2;
    optional bool update_wr_ptr = 3;
    optional RetCode ret_code = 4;
}

message DecParam {
    optional int32 iframe_search_enable = 1;
    optional int32 skipframe_mode = 2;
    oneof DecStdParam {
        int32 mp2_pic_flush = 3;
        int32 rv_dbk_mode = 4;
    }
    optional bool cra_as_bla_flag = 5;
    optional bool disable_film_grain = 6;
    optional uint32 pixel_luma_pad = 7;
    optional uint32 pixel_chroma_pad = 8;
    optional SramMode sram_mode = 9;
    optional bool thumbnail_mode = 10;
    optional uint32 clr_disp_flag = 11;
    optional uint32 set_disp_flag = 12;
}

message DecOutputExtData {
    optional uint32 user_data_header = 1;
    optional uint32 user_data_num = 2;
    optional uint32 user_data_size = 3;
    optional uint32 user_data_buf_full = 4;
    optional uint32 active_format = 5;
}

message DecVp8Info {
    message Vp8PicInfo {
        optional uint32 show_frame = 1;
        optional uint32 version_number = 2;
        optional uint32 ref_idx_last = 3;
        optional uint32 ref_idx_altr = 4;
        optional uint32 ref_idx_gold = 5;
    }
    optional Vp8ScaleInfo vp8_scale_info = 1;
    optional Vp8PicInfo vp8_pic_info = 2;
}

message DecAvcInfo {
    message MvcPicInfo {
        optional int32 view_idx_display = 1;
        optional int32 view_idx_decoded = 2;
    }
    message AvcFpaSei {
        optional uint32 exist = 1;
        optional uint32 frame_packing_arrangement_id = 2;
        optional uint32 frame_packing_arrangement_cancel_flag = 3;
        optional uint32 quincunx_sampling_flag = 4;
        optional uint32 spatial_flipping_flag = 5;
        optional uint32 frame0_flipped_flag = 6;
        optional uint32 field_views_flag = 7;
        optional uint32 current_frame_is_frame0_flag = 8;
        optional uint32 frame0_self_contained_flag = 9;
        optional uint32 frame1_self_contained_flag = 10;
        optional uint32 frame_packing_arrangement_extension_flag = 11;
        optional uint32 frame_packing_arrangement_type = 12;
        optional uint32 content_interpretation_type = 13;
        optional uint32 frame0_grid_position_x = 14;
        optional uint32 frame0_grid_position_y = 15;
        optional uint32 frame1_grid_position_x = 16;
        optional uint32 frame1_grid_position_y = 17;
        optional uint32 frame_packing_arrangement_repetition_period = 18;
    }
    message AvcHrdInfo {
        optional int32 cpb_minus1 = 1;
        optional int32 vcl_hrd_param_flag = 2;
        optional int32 nal_hrd_param_flag = 3;
    }
    message AvcRpSei {
        optional uint32 exist = 1;
        optional int32 recovery_frame_cnt = 2;
        optional int32 exact_match_flag = 3;
        optional int32 broken_link_flag = 4;
        optional int32 changing_slice_group_idc = 5;
    }
    optional MvcPicInfo mvc_pic_info = 1;
    optional AvcFpaSei avc_fpa_sei = 2;
    optional AvcHrdInfo avc_hrd_info = 3;
    optional AvcVuiInfo avc_vui_info = 4;
    optional AvcRpSei avc_rp_sei = 5;
}

message DecHevcInfo {
    message H265Info {
        optional int32 decoded_p_o_c = 1;
        optional int32 display_p_o_c = 2;
        optional int32 ctu_size = 3;
        optional int32 temporal_id = 4;
        optional int32 color_primaries = 5;
        optional int32 color_desc_present = 6;
        optional int32 vid_full_range = 7;
        optional int32 vui_param_present = 8;
        optional int32 vui_transfer_characteristics = 9;
        optional int32 vui_matrix_coefficients = 10;
        optional int32 master_meta_present = 11;
        optional uint32 display_primaries_x_b = 12;
        optional uint32 display_primaries_x_g = 13;
        optional uint32 display_primaries_x_r = 14;
        optional uint32 display_primaries_y_b = 15;
        optional uint32 display_primaries_y_g = 16;
        optional uint32 display_primaries_y_r = 17;
        optional uint32 white_point_x = 18;
        optional uint32 white_point_y = 19;
        optional uint32 max_display_mastering_luminance = 20;
        optional uint32 min_display_mastering_luminance = 21;
        optional int32 content_meta_present = 22;
        optional uint32 max_content_light_level = 23;
        optional uint32 max_pic_average_light_level = 24;
    }
    message H265RpSei {
        optional uint32 exist = 1;
