#Jimmy note: we can use env for the root
#var.basedir     = env.LIGHTTPDBASE
var.server_root	 = env.WEB_SERVER_ROOTPATH
var.log_root     = "/var/volatile"
#var.server_root = "/app/web-server-test"
#var.state_dir   = "/var/volatile"
#var.home_dir    = "/app/web-server-test/lighthttpd_1.4.55"
#var.conf_dir    = "/app/web-server-test/lighthttpd_1.4.55/config"

##Jimmy: do not know if this can take affect
###!!!teste: this will give a 'SERVER_NAME' env to fCGI
##server.name = "NCCU_V2"
##Jimmy: this tag is the response for the HTTP_HEADER 'server'
server.tag = "Web Server for NCCU_V2"

var.socket_dir  = log_root + "/sockets"

## Load the modules.
#include "modules.conf"
server.modules = (
  "mod_access",
#  "mod_alias",
#  "mod_auth",
#  "mod_authn_file",
#  "mod_evasive",
  "mod_setenv",
#  "mod_usertrack",
#  "mod_redirect",
  "mod_rewrite",
)

##
##  Basic Configuration
## ---------------------
##
server.port = 80
###server.use-ipv6 = "enable"
#server.bind = "localhost"
##
## Run as a different username/groupname.
## This requires root permissions during startup. 
##
######server.username  = "lighttpd"
######server.groupname = "lighttpd"
## 
## enable core files.
##
#server.core-files = "disable"
##
## Document root
##
server.document-root = server_root + "/www"
##
## store a pid file
##
server.pid-file = log_root + "/webserver.pid"
##
##  Logging Options
## ------------------
##
## all logging options can be overwritten per vhost.
##
## Path to the error log file
##
#Jimmy 20201208: not to log it and errorlog
#####server.errorlog = log_root + "/error.log"

##
## If you want to log to syslog you have to unset the 
## server.errorlog setting and uncomment the next line.
##
#server.errorlog-use-syslog = "enable"
##
## Access log config
## 
#include "conf.d/access_log.conf"
#server.modules += ("mod_accesslog")
#accesslog.filename  = log_root + "/access.log"

##
## The debug options are moved into their own file.
## see conf.d/debug.conf for various options for request debugging.
##
#include "conf.d/debug.conf"

server.event-handler = "linux-sysepoll"

server.network-backend = "sendfile"

#server.listen-backlog = 128

server.stat-cache-engine = "simple"
##
## Fine tuning for the request handling
##
## max-connections == max-fds/2 (maybe /3)
## means the other file handles are used for fastcgi/files
##

server.max-fds = 64
server.max-connections = 32

#server.max-keep-alive-idle = 5

#server.max-keep-alive-requests = 16


#server.max-request-size = 0

#server.max-read-idle = 60

#server.max-write-idle = 360

#server.kbytes-per-second = 128

#connection.kbytes-per-second = 32

index-file.names += (
  "index.html"
)

url.access-deny             = ( "~", ".inc" )

##
## url handling modules (rewrite, redirect)
##
#url.rewrite                = ( "^/$"             => "/server-status" )
#url.redirect               = ( "^/wishlist/(.+)" => "http://www.example.com/$1" )
url.rewrite-if-not-file 			= (
		"^/api/([^\?]+)(\?(.*))?" => "/web_main.api?page=$1&$3", #the api will not rewrite to web_api
		##"^/((?!api/).)+" => "/index.html" #others will goto index.html (for web front router)
		"^/?.*$" => "/index.html"
	)
##
## both rewrite/redirect support back reference to regex conditional using %n
##
#Jimmy: do not save cache so that frontend will refresh soon after a update
$HTTP["url"] =~ "^.+\.html$" {
 setenv.add-response-header += ("Cache-Control" => "no-store, no-cache, must-revalidate")
}
#added by Jimmy for log purpose
setenv.add-environment = ( "NCCU_DATA_PATH" => "/data" )

###static-file.exclude-extensions = ( ".php", ".pl", ".fcgi", ".scgi" )

#server.error-handler       = "/error-handler.html"
#server.error-handler       = "/error-handler.php"

#server.error-handler-404   = "/error-handler.html"
#server.error-handler-404   = "/error-handler.php"

#server.errorfile-prefix    = "/srv/www/htdocs/errors/status-"

##
## directory listing configuration
##
#include "conf.d/dirlisting.conf"
dir-listing.activate      = "disable"
dir-listing.hide-dotfiles = "disable" 
dir-listing.exclude       = ( "~$" )
dir-listing.encoding = "UTF-8"
dir-listing.hide-header-file = "disable"
dir-listing.show-header = "disable"
dir-listing.hide-readme-file = "disable"
dir-listing.show-readme = "disable"

##added for fastCGI
#include "conf.d/fastcgi.conf"
server.modules += ( "mod_fastcgi" )
#added by Jimmy for debug purpose
fastcgi.debug = 1
###added for c-fcgi
fastcgi.server = ( 
  ".api" => (( 
    "host" => "127.0.0.1",
    "port" => "2000",
    "bin-path" => server_root + "/www/web_main.api",
    "min-procs" => 1,
    "max-procs" => 1,
  )))


server.follow-symlink = "enable"

#server.upload-dirs = ( "/var/tmp" )

###added by Jimmy 20210517 for HTTPS
server.modules += ("mod_openssl")
$SERVER["socket"] == ":2238" {
    ssl.engine = "enable" 
    ssl.pemfile = "/app/web/server/server.pem" 
}

