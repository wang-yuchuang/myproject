# xip 变体参数组 (ssdk-project-mode-unification D2/D3)
# 用途: default 模板 defconfig + 本文件 + calc MEM_BASE -> 构建期 xip(-s A/B) 变体 defconfig
# 语义: NOR XIP 链接, slot 由构建 -s A/B 决定; 模板已含全部 bool 差异项(y 态)
#
# 注1: ARMV7R_TCMA/TCMB_BASE 在 arch/arm/armv7-r/Kconfig(default 0x4C0000/0x4B0000) 与
#      boards/bmu05_a00/secure/Kconfig(default 0x004b0000/0x004c0000) 重复定义——defconfig
#      显式行是必要消歧(确保用 board 值), 不可省略 (GATE 3a 实测教训)
# 注2: RAM_BASE/RAM_SIZE 同理由 secure/Kconfig 提供(depends XIP_MODE); 显式行防 arch 层
#      未来重复定义, 与现 xip defconfig 对齐
CONFIG_MEM_SIZE=0x100000
# AP<->SEC IPCC 接收缓冲区数: Kconfig 默认 4 偏小(突发易耗尽), 与 emmc_only/emu01 对齐取 16
CONFIG_IPCC_BUFF_NUM=16
CONFIG_ARMV7R_TCMA_BASE=0x004b0000
CONFIG_ARMV7R_TCMB_BASE=0x004c0000
CONFIG_RAM_BASE=0x140000
CONFIG_RAM_SIZE=0xC0000
CONFIG_IRAM_NONE_ECC_BASE=0x0
CONFIG_IRAM_NONE_ECC_SIZE=0x0
# CONFIG_MEM_BASE 由 gen_variant_defconfig.sh 从 calc --emit 注入 (占位, 不得手填)
#   -s A: 0x081eb000   -s B: 0x082db000 (slot B = slot A + ssystem 分区大小, D2a/D3)
