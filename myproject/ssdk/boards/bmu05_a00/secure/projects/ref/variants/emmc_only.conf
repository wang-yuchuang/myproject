# emmc_only 变体参数组 (ssdk-project-mode-unification D2/D4)
# 用途: default 模板 defconfig + 本文件 -> 构建期 emmc_only 变体 defconfig
# 语义: OCRAM 链接(MEM_BASE=0x140000, 不经 calc) / STR off / 无 NOR OTA / IPCC 16
#
# 约束: Kconfiglib defconfig.py 不支持赋值行行尾注释 (含注释则整行被丢弃),
#       注释必须独立成行 (本文件已遵守)
# 注: RAM_BASE/RAM_SIZE/TCM/IRAM 由 secure/Kconfig 默认值覆盖(依赖 XIP_MODE
#     的随 XIP_MODE off 自动失效), 无需在此处理
CONFIG_MEM_BASE=0x140000
CONFIG_MEM_SIZE=0xC0000
CONFIG_IPCC_BUFF_NUM=16

# --- bool 差异关闭 (模板置 y 项在此关闭) ---
# CONFIG_XIP_MODE is not set
# CONFIG_EARLYCOPY is not set
# CONFIG_SUPPORT_STR_MODE is not set
# CONFIG_SYSMON_BOOT_MEDIA_NOR_XIP is not set
CONFIG_SYSMON_BOOT_MEDIA_EMMC=y
# CONFIG_UPDATE_FLASH is not set
# CONFIG_GPT_SLOT_SWITCH is not set
# CONFIG_DISK_NOR_FLASH is not set
# CONFIG_ICCMSG_DEMO is not set
# ICCMSG_DEMO: B 类遗留项 (xip 现状=y), emmc 无, 阶段 5 评估移除
