# xip 变体参数组 (ssdk-standalone-boot-mode Stage-3)
# 用途: 模板 defconfig + 本文件 + calc MEM_BASE -> 构建期 xip(-s A/B) 变体 defconfig
# 语义: NOR XIP 链接, slot 由构建 -s A/B 决定; 模板已含 xip 侧 bool 差异项(y 态)
#
# 注: ARMV7R_TCMA/TCMB_BASE 在 arch/arm/armv7-r/Kconfig 与 boards/emu01_a00/secure/Kconfig
#     (default 0x004b0000/0x004c0000) 重复定义——defconfig 显式行是必要消歧(确保用 board 值)
# 注: RAM_BASE/RAM_SIZE 同理由 secure/Kconfig 提供(depends XIP_MODE); 显式行与现 xip defconfig 对齐
# IPCC_BUFF_NUM=16: AP↔SEC IPC 缓冲区数, 对齐 bmu05 核心板验证值 (Kconfig 默认 4 不够 OTA 用)
CONFIG_MEM_SIZE=0x100000
CONFIG_IPCC_BUFF_NUM=16
CONFIG_RAM_BASE=0x140000
CONFIG_RAM_SIZE=0xC0000
CONFIG_ARMV7R_TCMA_BASE=0x004b0000
CONFIG_ARMV7R_TCMB_BASE=0x004c0000
CONFIG_IRAM_NONE_ECC_BASE=0x0
CONFIG_IRAM_NONE_ECC_SIZE=0x0
# CONFIG_MEM_BASE injected by calc_xip_membase.sh (do not hardcode)

# --- ref 侧 bool 差异关闭 (模板置 y 项在此关闭) ---
# CONFIG_DISPSS is not set
# CONFIG_DISPSS_KUNLUN is not set
# CONFIG_DW_I2C is not set
# CONFIG_DISPLAY_SERVICE is not set
# CONFIG_DISP_TESTER is not set
# CONFIG_DISP_PQ_TESTER is not set
# CONFIG_DDR_EXEC_TEST is not set
# CONFIG_DDR_LOADER is not set
